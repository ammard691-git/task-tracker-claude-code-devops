[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "task-tracker"
version = "1.0.0"
description = "A robust command-line task tracker backed by a local JSON file."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
task-tracker = "task_tracker.cli:main"

[tool.setuptools]
packages = ["task_tracker"]
